<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <h1>Driving license</h1>
    <form id="details">
        <label>Name:</label>
        <input type="text" id="name" required>
        <br><br>
        <label>Age:</label>
        <input type="number" id="age" required>
        <br><br>
        <label>dob:</label>
        <input type="date" id="dob" required>
        <br><br>
        <label>Phone no:</label>
        <input type="number" id="phone" required>
        <br><br>
        <label>address:</label>
        <input type="text" id="address" required>
        <br><br>
        <label>Gender:</label>
        <input type="radio" name="gender" id="male" value="male" required>male
        <input type="radio" name="gender" id="female" value="female" required>female
        <input type="radio" name="gender" id="others" value="others" required>others
        <br> <br>
        
         <label>photo</label>
         <input type="file" id="image" accept="image/*" required>
         <br><br>
         <label>verified</label>
        <input type="checkbox" name="Document" value="rc" required>rc book
        <input type="checkbox" name="Document" value="insurance" required>insurance
        <input type="checkbox" name="Document" value="polution" required>polution
        

        <button type="submit">submit</button>
    </form>
    <h2>licese details</h2>
    <div id="class">
        <img id="dp" scr="" width="200">
        <div class="room">
            <p id="p1"></p>
            <p id="p2"></p>
            <p id="p3"></p>
            <p id="p4"></p>
            <p id="p5"></p>
             <p id="p6"></p>
              <p id="p7"></p>
        </div>
    </div>
    <script src="form.js"> </script>
</body>
</html>
